<style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#202d4b,#101827 65%);color:#f8fafc;font:600 18px system-ui,-apple-system,sans-serif;min-height:100dvh}main{max-width:480px;margin:auto;padding:26px 20px 45px}header{display:flex;align-items:center;gap:12px;margin-bottom:42px}header b{background:#ffdb80;color:#172033;padding:13px 18px;border-radius:20px;font-size:30px}h1{font-size:29px;margin:0}small,p{color:#aab8d2}small{font-size:14px}.panel{border:1px solid #43516c;background:#1c293f;border-radius:24px;padding:24px;text-align:center;min-height:310px;display:flex;flex-direction:column;justify-content:center;gap:15px}h2{font-size:27px;margin:0}p{line-height:1.8;margin:0}button,select,input{font:inherit;border-radius:14px;padding:16px;width:100%;border:1px solid #52627b;background:#293952;color:white}button{cursor:pointer;background:#ffda80;color:#172033;border:0;font-weight:800}button.secondary{background:#34435c;color:#fff}button:disabled{opacity:.5}.stack{display:grid;gap:12px}.secret{font-size:38px;font-weight:900;color:#ffdb80;overflow-wrap:anywhere}.muted{font-size:15px;color:#aab8d2}.pill{background:#2e405d;border-radius:99px;padding:8px 14px;font-size:14px;display:inline-block}footer{text-align:center;color:#72839f;font-size:13px;margin-top:35px}label{display:block;text-align:right;margin-bottom:6px;font-size:15px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choices button{font-size:15px;padding:14px}.scoreline{display:flex;justify-content:space-between;gap:12px;background:#283952;border-radius:12px;padding:11px 14px;font-size:15px}.scoreline strong{color:#ffda80}</style>
<main><header><b>؟</b><div><h1>منو الدخيل؟</h1><small>لعبة السوالف العراقية • من ٣ إلى ١٠ لاعبين</small></div></header><section id="app"></section><footer>تلفون واحد • بدون حساب • العبوا وستانسوا</footer></main>
<script>
const groups={
'حيوانات':'أسد،نمر،فيل،زرافة،قرد،غوريلا،كلب،قطو،حصان،حمار،بقرة،خروف،ماعز،جمل،دب،ذئب،ثعلب،أرنب،فأر،سنجاب،كنغر،باندا،كوالا،بطريق،نعامة،نسر،صقر،بومة،ببغاء،حمامة،دجاجة،بطة،طاووس،تمساح،سلحفاة،ثعبان،وزغة،ضفدع،قرش،دلفين،حوت،أخطبوط،سرطان بحر،سمچة،فراشة،نحلة،نملة،صرصور،عنكبوت،بعوضة،خفاش،قنفذ،فرس النهر،وحيد القرن،حمار وحشي،غزال',
'أكل وشرب':'دولمة،برياني،كباب،مسگوف،باجة،تشريب،قيمة،كبة،فلافل،شاورما،بيتزا،برگر،معكرونة،اندومي،رز،خبز،صمون،طرشي،كاهي،گيمر،عسل،تمر،كليجة،كيك،بسكوت،آيس كريم،شوكولاتة،فشار،شيبس،جبن،بيض،بطاطا،بطيخ،رگي،موز،تفاح،برتقال،ليمون،عنب،رمان،فراولة،مانگو،چاي،قهوة،عصير،بيبسي،حليب،لبن،ماي',
'أغراض البيت':'ثلاجة،غسالة،طباخ،فرن،مايكرويف،مكيف،مروحة،تلفزيون،ريموت،كنبة،سرير،مخدة،بطانية،سجادة،ستارة،مراية،خزانة،طاولة،كرسي،مصباح،ساعة،باب،شباك،مفتاح،قفل،مكنسة،صابون،شامبو،فرشاة أسنان،منشفة،مقص،سكين،ملعقة،صحن،چدر،استكان،قدح،قنينة،شاحن،بطارية،كيس،علبة،كتاب،قلم،دفتر،حقيبة،حذاء،نعال،جاكيت',
'أماكن':'مدرسة،جامعة،مستشفى،صيدلية،مطعم،كافيه،مول،سوق،حديقة،ملعب،سينما،مطار،محطة قطار،گراج،فندق،شاطئ،نهر،بحر،جبل،صحراء،غابة،جزيرة،مزرعة،حديقة حيوان،متحف،مكتبة،مسجد،بيت،مطبخ،حمام،سطح،مصعد،باص،تكسي،شارع،جسر،مدينة ألعاب،مسبح،مخبز،حلاق،بنك،مكتب،قاعة امتحان،محل ملابس',
'مواصلات':'سيارة،تكسي،باص،دراجة،دراجة نارية،طيارة،هليكوبتر،قطار،سفينة،زورق،قارب،شاحنة،تكتك،تراكتور،إسعاف،سيارة إطفاء،سيارة شرطة،سكوتر،مترو،عربة،جت سكي،غواصة،صاروخ',
'طبيعة وطقس':'شمس،قمر،نجمة،مطر،ثلج،برد،حر،ريح،عاصفة،غيمة،ضباب،برق،رعد،قوس قزح،بحر،نهر،بحيرة،شلال،جبل،وادي،غابة،شجرة،وردة،عشب،رمل،طين،حجر،نار،دخان،بركان،زلزال،فيضان،صحراء،جزيرة،كهف',
'ملابس وإكسسوارات':'قميص،بنطرون،تيشيرت،فستان،عباية،دشداشة،جاكيت،معطف،قبعة،حجاب،نظارات،نظارات شمسية،ساعة يد،خاتم،سلسلة،سوار،حزام،جوارب،حذاء،نعال،جنطة،محفظة،قفازات،شال،ربطة عنق،بدلة،بيجامة',
'رياضة وألعاب':'كرة قدم،كرة سلة،تنس،سباحة،ملاكمة،مصارعة،جري،قفز،دراجة،شطرنج،دومينو،طاولة زهر،بليارد،بولينگ،بلايستيشن،كرة طائرة،تنس طاولة،جيم،يوغا،تزلج،صيد،مضرب،مرمى،صفارة،كأس،ميدالية،حكم،حارس مرمى،ملعب،جمهور',
'تكنولوجيا':'موبايل،لابتوب،كمبيوتر،كيبورد،ماوس،سماعات،مايكروفون،كاميرا،طابعة،شاشة،راوتر،واي فاي،بلوتوث،شاحن،باور بانك،ساعة ذكية،تابلت،روبوت،درون،فلاش ميموري،هارد،بروجكتر،ريموت،تلفزيون،إنستغرام،تيك توك،واتساب،يوتيوب،سناب چات،گوگل',
'مهن وشخصيات':'طبيب،مهندس،مدرس،شرطي،طيار،طباخ،حلاق،نجار،حداد،مزارع،صياد،سائق،مصور،مغني،ممثل،رسام،لاعب كرة،حكم،محامي،قاضي،صيدلي،ممرض،رجل إطفاء،عامل بناء،كهربائي،ميكانيكي،بائع،خباز،مذيع،مترجم،عالم،رائد فضاء،ساحر،مهرج،ملك،ملكة،قرصان',
'أشياء خيالية':'تنين،زومبي،شبح،فضائي،ديناصور،روبوت،ساحر،مصاص دماء،مستذئب،حورية بحر،وحش،جني،مومياء،سفينة فضائية،آلة زمن،بساط طائر،عصا سحرية،كنز،تاج،قلعة،بوابة سحرية،سيف،درع،إكسير،كوكب',
'أشياء نستخدمها كل يوم':'مفتاح،شاحن،مراية،قلم،محفظة،موبايل،كلاص،ساعة،حقيبة،ريموت،نظارات،منشفة،صابون،مقص،كرسي،مصباح،بطانية،قنينة،دفتر،مخدة،سماعة،فرشاة،حذاء،علبة،سكين،صحن،مروحة،مظلة،مشط،كيس،كتاب،كاميرا،مفتاح سيارة،عطر،شمعة،شريط لاصق،كوب،مغناطيس،سجادة،بطارية',
'أشياء تنأكل أو تنشرب':'تمر،تفاح،موز،بطاطا،بيض،جبن،حليب،عسل،چاي،قهوة،لبن،رمان،ليمون،فشار،شوكولاتة،كليجة،فلافل،كباب،رز،خبز،صمون،عنب،مخلل،بطيخ،رگي،فراولة،برتقال،سمچ،دجاج،كيك،بسكوت،آيس كريم،معكرونة،تمر هندي،عصير،بيبسي،مربى،شوربة،شاورما،برياني',
'ألوان وأشكال':'أحمر،أزرق،أخضر،أصفر،أسود،أبيض،وردي،بنفسجي،برتقالي،ذهبي،فضي،بني،رمادي،دائرة،مربع،مثلث،نجمة،قلب،سهم،مستطيل،مكعب،كرة،هرم،حلقة'
};const $=document.getElementById('app');let playerCount=5;let names=Array.from({length:5},(_,i)=>'اللاعب '+(i+1)),cat='عشوائي',round=0,word='',spy=0,turn=0,seen=false,votes=[],voter=0,seconds=180,timer=null;const keys=Object.keys(groups);const rand=n=>{if(globalThis.crypto?.getRandomValues){let a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}return Math.floor(Math.random()*n)};let spyBag=[],spyBagSize=0,lastSpy=-1;function nextSpy(){if(spyBagSize!==playerCount){spyBag=[];spyBagSize=playerCount;lastSpy=-1}if(!spyBag.length){spyBag=Array.from({length:playerCount},(_,i)=>i);for(let i=spyBag.length-1;i>0;i--){let j=rand(i+1);[spyBag[i],spyBag[j]]=[spyBag[j],spyBag[i]]}if(spyBag.length>1&&spyBag[spyBag.length-1]===lastSpy){let j=rand(spyBag.length-1);[spyBag[j],spyBag[spyBag.length-1]]=[spyBag[spyBag.length-1],spyBag[j]]}}lastSpy=spyBag.pop();return lastSpy}let lastSpies=[];let usedWords=new Set();let scores={};try{scores=JSON.parse(localStorage.getItem('imposterScores')||'{}')}catch(e){}let pickedCategory='',guessOptions=[],found=false;function saveScores(){try{localStorage.setItem('imposterScores',JSON.stringify(scores))}catch(e){}}function scoreboard(){return '<h2>لوحة النقاط</h2><div class="stack">'+names.map(n=>'<div class="scoreline"><span>'+esc(n)+'</span><strong>'+Number(scores[n]||0)+' نقطة</strong></div>').join('')+'</div>'}const panel=(html)=>{ $.innerHTML='<div class="panel">'+html+'</div>' };const btn=(s,fn,cls='')=>'<button '+(cls?'class="'+cls+'"':'')+' onclick="'+fn+'">'+s+'</button>';function setup(){clearInterval(timer);panel('<h2>جاهزين للسالفة؟</h2><p>الكل يعرف نفس الكلمة، إلا دخيل واحد ما يعرفها. كل واحد يشوف بطاقته ويخفيها.</p><div class="stack"><label>عدد اللاعبين</label><div class="choices">'+btn('− احذف لاعب','setCount(-1)','secondary')+btn('+ أضف لاعب','setCount(1)')+'</div><span class="pill">'+playerCount+' لاعبين</span><label>اختاروا الموضوع</label><select id="cat"><option>عشوائي</option>'+keys.map(k=>'<option '+(cat===k?'selected':'')+'>'+k+'</option>').join('')+'</select>'+names.map((n,i)=>'<input id="n'+i+'" maxlength="18" value="'+esc(n)+'" aria-label="اسم اللاعب '+(i+1)+'">').join('')+scoreboard()+btn('يلا نبدأ','start()')+btn('تصفير النقاط','resetScores()','secondary')+'</div>')}function setCount(delta){const sel=document.getElementById('cat');if(sel)cat=sel.value;const old=names.map((n,i)=>document.getElementById('n'+i)?.value||n);playerCount=Math.max(3,Math.min(10,playerCount+delta));names=Array.from({length:playerCount},(_,i)=>old[i]||'اللاعب '+(i+1));setup()}function start(){cat=document.getElementById('cat').value;names=names.map((n,i)=>document.getElementById('n'+i).value.trim()||'اللاعب '+(i+1));pickedCategory=cat==='عشوائي'?keys[rand(keys.length)]:cat;let list=groups[pickedCategory].split('،');let available=list.filter(w=>!usedWords.has(w));if(!available.length){usedWords.clear();available=list.filter(w=>w!==word);if(!available.length)available=list}word=available[rand(available.length)];usedWords.add(word);let pool=list.filter(w=>w!==word);for(let i=pool.length-1;i>0;i--){let j=rand(i+1);[pool[i],pool[j]]=[pool[j],pool[i]]}guessOptions=[word,...pool.slice(0,5)];for(let i=guessOptions.length-1;i>0;i--){let j=rand(i+1);[guessOptions[i],guessOptions[j]]=[guessOptions[j],guessOptions[i]]}spy=nextSpy();turn=0;seen=false;votes=[];voter=0;round++;pass()}function pass(){panel('<span class="pill">الجولة '+round+' • '+(turn+1)+' من ٤</span><h2>سلّم التلفون إلى<br>'+esc(names[turn])+'</h2><p>لا تخلي غيرك يشوف البطاقة</p>'+btn('اكشف بطاقتي','reveal()'))}function reveal(){seen=true;panel('<span class="pill">'+esc(names[turn])+'</span>'+(turn===spy?'<div class="secret">إنت الدخيل!</div><p>ما تعرف الكلمة. اسمع تلميحاتهم وحاول تتصرف طبيعي.</p>':'<p>الكلمة السرية هي</p><div class="secret">'+esc(word)+'</div><p>انطي تلميح ذكي، لا تفضح الكلمة.</p>')+btn('خفي البطاقة ومرر التلفون','next()'))}function next(){turn++;if(turn<playerCount)pass();else discussion()}function discussion(){seconds=180;talk();timer=setInterval(()=>{if(seconds>0){seconds--;let t=document.getElementById('clock');if(t)t.textContent=fmt(seconds)}else clearInterval(timer)},1000)}function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function talk(){panel('<span class="pill">وقت السوالف</span><h2>منو تتوقعون الدخيل؟</h2><div class="secret" id="clock">'+fmt(seconds)+'</div><p>كل واحد يوصف الكلمة بدون ما يذكرها. الدخيل يحاول يندمج وياكم.</p>'+btn('يلا نخمن الكلمة','guessPass()')+btn('جولة جديدة','setup()','secondary'))}function vote(){clearInterval(timer);voter=0;votes=[];votePass()}function votePass(){panel('<span class="pill">التصويت • '+(voter+1)+' من ٤</span><h2>دور '+esc(names[voter])+'</h2><p>سلّم التلفون إله حتى يصوّت بالسر</p>'+btn('أصوّت هسه','votePick()'))}function votePick(){panel('<h2>منو الدخيل برأيك؟</h2><p>اختار لاعب غير نفسك</p><div class="choices">'+names.map((n,i)=>i===voter?'':btn(esc(n),'cast('+i+')','secondary')).join('')+'</div>')}function cast(i){votes.push(i);voter++;if(voter<playerCount)votePass();else result()}function result(){let counts=Array(playerCount).fill(0);votes.forEach(i=>counts[i]++);let max=Math.max(...counts),winners=counts.map((n,i)=>n===max?i:-1).filter(i=>i>=0);found=winners.length===1&&winners[0]===spy;panel('<span class="pill">نتيجة التصويت</span><h2>'+(found?'مسكتوا الدخيل!':'ما اتفقتوا على الدخيل!')+'</h2><p>الدخيل هو <strong>'+esc(names[spy])+'</strong></p><p>الأصوات: '+names.map((n,i)=>esc(n)+' '+counts[i]).join(' • ')+'</p><p>بس بعد عنده فرصة يخمّن الكلمة ويفوز!</p>'+btn('سلّم التلفون للدخيل','guessPass()'))}
function guessPass(){clearInterval(timer);panel('<h2>دور '+esc(names[spy])+'</h2><p>الدخيل عنده محاولة وحدة يختار من ٦ كلمات. لا أحد يساعده!</p>'+btn('شوف الخيارات','guessScreen()'))}
function guessScreen(){panel('<span class="pill">تحدي الدخيل</span><h2>شنو الكلمة السرية؟</h2><p>اختار وحدة من هاي الكلمات الستة</p><div class="choices">'+guessOptions.map((w,i)=>btn(esc(w),'finish('+i+')','secondary')).join('')+'</div>')}
function finish(i){const correct=guessOptions[i]===word;if(correct){scores[names[spy]]=(scores[names[spy]]||0)+3}else{names.forEach((n,j)=>{if(j!==spy)scores[n]=(scores[n]||0)+2})}saveScores();panel('<span class="pill">نهاية الجولة '+round+'</span><h2>'+(correct?'الدخيل خمّنها صح!':'الفريق فاز!')+'</h2><p>الكلمة كانت</p><div class="secret">'+esc(word)+'</div><p>'+(correct?'الدخيل +٣ نقاط':'كل لاعب مو دخيل +٢ نقاط')+'</p>'+scoreboard()+btn('جولة جديدة','setup()')+btn('تصفير النقاط','resetScores()','secondary'))}
function resetScores(){if(!confirm('متأكد تريد تصفّر كل النقاط؟'))return;scores={};saveScores();setup()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}setup();
</script></html>
