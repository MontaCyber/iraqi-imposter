<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>منو الدخيل؟</title>
<style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#202d4b,#101827 65%);color:#f8fafc;font:600 18px system-ui,-apple-system,sans-serif;min-height:100dvh}main{max-width:480px;margin:auto;padding:26px 20px 45px}header{display:flex;align-items:center;gap:12px;margin-bottom:42px}header b{background:#ffdb80;color:#172033;padding:13px 18px;border-radius:20px;font-size:30px}h1{font-size:29px;margin:0}small,p{color:#aab8d2}small{font-size:14px}.panel{border:1px solid #43516c;background:#1c293f;border-radius:24px;padding:24px;text-align:center;min-height:310px;display:flex;flex-direction:column;justify-content:center;gap:15px}h2{font-size:27px;margin:0}p{line-height:1.8;margin:0}button,select,input{font:inherit;border-radius:14px;padding:16px;width:100%;border:1px solid #52627b;background:#293952;color:white}button{cursor:pointer;background:#ffda80;color:#172033;border:0;font-weight:800}button.secondary{background:#34435c;color:#fff}button:disabled{opacity:.5}.stack{display:grid;gap:12px}.secret{font-size:38px;font-weight:900;color:#ffdb80;overflow-wrap:anywhere}.muted{font-size:15px;color:#aab8d2}.pill{background:#2e405d;border-radius:99px;padding:8px 14px;font-size:14px;display:inline-block}footer{text-align:center;color:#72839f;font-size:13px;margin-top:35px}label{display:block;text-align:right;margin-bottom:6px;font-size:15px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choices button{font-size:15px;padding:14px}</style>
<main><header><b>؟</b><div><h1>منو الدخيل؟</h1><small>لعبة السوالف العراقية • ٤ لاعبين</small></div></header><section id="app"></section><footer>تلفون واحد • بدون حساب • العبوا وستانسوا</footer></main>
<script>
const groups={
'أكلات عراقية':'دولمة،برياني،تمن وقيمة،تشريب،كبة حلب،كباب،مسگوف،باجة،كاهي،گيمر،فلافل،صمون،طرشي،قوزي،مرگة بامية،بيض وطماطة،لبلبي،شاورما،شاي مهيل،قيمر وعسل،كبة موصلية،تمن باگلة،كليجة،مخلل،زلاطة،دبس وراشي',
'مواقف تفشل':'تطيح بالشارع،تنادي المدرس بابا،ترسل رسالة بالغلط،تنسى اسم صاحبك،يطلع صوت بطنك،تلبس نعال مختلف،تگعد بمكان مو إلك،تنسى المايك مفتوح،تضحك بالعزاء،تلوح لشخص مو يعرفك،تطيح بالمطعم،تنكشف كذبتك،تنسى عيد ميلاد،تنسى المحفظة،تجاوب على سؤال مو إلك',
'الجامعة والمدرسة':'امتحان مفاجئ،مراقب،دفتر حضور،بروجكتر،محاضرة الصبح،واجب،سفرة مدرسية،سبورة،مدرس عصبي،استراحة،غش،تقرير،مناقشة مشروع،كافتيريا،مكتبة،حقيبة،سؤال صعب،درجة صفر،عطلة،طالب متأخر',
'سوالف البيت':'ريموت،مولدة،سطح،ثلاجة،مكيف،غسالة،جار فضولي،ضيف مفاجئ،تنظيف،عزيمة،سجادة،چاي،مطبخ،باب البيت،شاحن،مفتاح ضايع،طفاية،نومة العصر،دگة باب،انقطاع الكهرباء',
'أماكن عراقية':'شارع المتنبي،المنصور،الكرادة،زيونة،الجادرية،أربيل،البصرة،النجف،كربلاء،الموصل،بغداد الجديدة،الأعظمية،الكاظمية،باب الشرقي،مدينة الصدر،الزعفرانية،شارع فلسطين،الحلة،سامراء،دهوك',
'رياضة وكورة':'حارس مرمى،تسلل،ضربة جزاء،حكم،بطاقة حمراء،ملعب،مشجع،ديربي،ركلة ركنية،هدف عكسي،تمرين،كرة سلة،مصارعة،ملاكمة،كابتن،صفارة،بدلاء،وقت إضافي،كأس،نهائي',
'شخصيات وأنواع ناس':'الفضولي،البخيل،الثرثار،النعسان،المتأخر،المتفلسف،العصبي،الهادئ،المشاكس،المغرور،المحبوب،النسيان،الذكي،الكسول،الكذاب،المهرج،الخواف،العنيد،المتوتر،المتحمس',
'موبايل وإنترنت':'واتساب،انستغرام،تيك توك،سناب،ستوري،لايك،بلوك،سكرين شوت،شاحن،باور بانك،واي فاي،رمز سري،مكالمة فائتة،رسالة صوتية،كاميرا،فلتر،بطارية،تطبيق،قروب عائلة،إشعار',
'طلعات ووناسة':'سينما،مول،مطعم،كافيه،حديقة،سفر،بحر،مسبح،عرس،حفلة،عيد ميلاد،سيارة أجرة،زحمة،فندق،مطار،تصوير،شيشة،ألعاب،تسوق،نزهة',
'أشياء عجيبة':'ديناصور،فضائي،روبوت،ساحر،شبح،كنز،مومياء،بركان،صاروخ،غواصة،مهرج،تنين،زومبي،قلعة،مغناطيس،منطاد،مرآة سحرية،آلة زمن،وحش،كوكب',
'مواقف تخليك تصيح':'تدز فويس بالغلط للكروب،أمك تفتح تلفونك،تگعد من النوم وتلكه الضيوف،تسوي روحك نايم،تگول نكتة ومحد يضحك،تنزل ستوري للشخص الغلط،ينقطع النت بنص المكالمة،تسلم على واحد وما يرد،تنسى شنو تريد تگول،تتعارك على آخر قطعة بيتزا،تسوي نفسك تعرف الأغنية،ينكشف حسابك الوهمي،تطلع صورتك بالهوية،تدوس على ليگو،تفتح الكاميرا بالغلط،تنادي شخص باسم حبيبك السابق،تدخل قاعة غلط،تگعد من النوم بعد الامتحان،تنسى كلمة سر تلفونك،تشوف نفسك بالكاميرا الأمامية',
'أسئلة لو خيروك':'تعيش بدون إنترنت،تقرأ أفكار الناس،تصير مشهور فجأة،ترجع بالزمن،تصير غير مرئي،تاكل نفس الأكلة سنة،تبدل حياتك ويا صديقك،تنام يوم كامل،تسافر للمريخ،تربح مليون دولار،تحچي ويا الحيوانات،تطير بدون جناح،تعرف مستقبلك،توقف الزمن،تعيش بفلم رعب،تختفي أسبوع،تصير طفل من جديد،تسكن بقصر مسكون،تعيش بلا موبايل،تبدل صوتك',
'أشياء الكل يعرفها بس تفشل':'الكرسي البلاستك،نعال الحمام،الريموت الضايع،كيس الأكياس،علبة البسكوت بيها خياطة،صوت المولدة،كلاص الشاي المكسور،المكيف اللي يقطر،الشاحن المشترك،باب يصيح،المروحة السقفية،البطانية الثقيلة،قنينة الماي المجمدة،دفتر الديون،قفل الباب الخربان،كيس الخبز،الجار اللي يدگ بالليل،صحن الدولمة،الصمون الحار،قنينة الغاز',
'شخصيات مشهورة وخيالية':'سبونج بوب،مستر بين،باتمان،سبايدرمان،شريك،هاري بوتر،توم وجيري،دورا،كونان،ناروتو،سوپر ماريو،هالك،باربي،جوكر،باباي،علاء الدين،سندباد،طرزان،سوبرمان،سانتا كلوز',
'أشياء تخوف بالليل':'صوت بالسطح،رسالة من رقم مجهول،باب ينفتح وحده،مكالمة الساعة ٣،ظل بالشباك،انقطاع الكهرباء،حلم غريب،خطوات بالممر،مراية مظلمة،صوت ثلاجة،كلب ينبح،شخص وراك،مصعد يوقف،بيت مهجور،صوت ضحك،لعبة تتحرك،نقطة ضوء،طرگة باب،نفق مظلم،صورة تتحرك',
'حياة العراقيين':'طابور البنزين،زحمة الجسر،أبو التكسي،دگة مولدة،كارت شحن،أبو البسطية،الگراج،خط الجامعة،موعد الكهربا،گعدة السطح،الگهوة،المضيف،سفرة الجمعة،عرس عراقي،أبو المحل،عركة على الدور،نص دينار،كيس ثلج،نومة الظهر،چاي العصر',
'مواقف حب وغيرة':'تراقب الستوري،لايك بالغلط،رسالة انقرت وما انردت،تكتب وتمسح،تسوي بلوك وترجع،غيرة من صديق،تشوف الإكس،موعد أول،وردة حمراء،اعتراف حب،هدية غريبة،حساب وهمي،تنسى الذكرى السنوية،مكالمة طويلة،قلب مكسور،تنتظر الرد،تغار من تعليق،تگول مشتاق،تدز أغنية،تسوي نفسك مو مهتم',
'أشياء ما تتوقعها':'بطريق بالشارع،بقرة بالمصعد،دجاجة تسوق،سمچة تطير،موزة تتكلم،روبوت يطبخ،قطو بالجامعة،ديناصور بالمول،حوت بالبانيو،فضائي بالتكسي،شبح بالدوام،بطاطا ملكة،مهرج بالمستشفى،صرصور عملاق،ساحر بالامتحان،تنين بالكافتيريا،نعال ذكي،سيارة تطير،بيت يمشي،كلب يدرس'
};const $=document.getElementById('app');let names=['اللاعب ١','اللاعب ٢','اللاعب ٣','اللاعب ٤'],cat='عشوائي',round=0,word='',spy=0,turn=0,seen=false,votes=[],voter=0,seconds=180,timer=null;const keys=Object.keys(groups);const rand=n=>{if(globalThis.crypto?.getRandomValues){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}return Math.floor(Math.random()*n)};let lastSpies=[];let usedWords=new Set();const panel=(html)=>{ $.innerHTML='<div class="panel">'+html+'</div>' };const btn=(s,fn,cls='')=>'<button '+(cls?'class="'+cls+'"':'')+' onclick="'+fn+'">'+s+'</button>';function setup(){clearInterval(timer);panel('<h2>جاهزين للسالفة؟</h2><p>٣ يعرفون نفس الكلمة، وواحد دخيل ما يعرفها. كل واحد يشوف بطاقته ويخفيها.</p><div class="stack"><label>اختاروا الموضوع</label><select id="cat"><option>عشوائي</option>'+keys.map(k=>'<option '+(cat===k?'selected':'')+'>'+k+'</option>').join('')+'</select>'+names.map((n,i)=>'<input id="n'+i+'" maxlength="18" value="'+n+'" aria-label="اسم اللاعب '+(i+1)+'">').join('')+btn('يلا نبدأ','start()')+'</div>')}function start(){cat=document.getElementById('cat').value;names=names.map((n,i)=>document.getElementById('n'+i).value.trim()||'اللاعب '+(i+1));let list=groups[cat==='عشوائي'?keys[rand(keys.length)]:cat].split('،');let available=list.filter(w=>!usedWords.has(w));if(!available.length){usedWords.clear();available=list.filter(w=>w!==word);if(!available.length)available=list}word=available[rand(available.length)];usedWords.add(word);let candidates=[0,1,2,3].filter(i=>!lastSpies.includes(i));if(!candidates.length)candidates=[0,1,2,3];spy=candidates[rand(candidates.length)];lastSpies.push(spy);if(lastSpies.length>2)lastSpies.shift();turn=0;seen=false;votes=[];voter=0;round++;pass()}function pass(){panel('<span class="pill">الجولة '+round+' • '+(turn+1)+' من ٤</span><h2>سلّم التلفون إلى<br>'+esc(names[turn])+'</h2><p>لا تخلي غيرك يشوف البطاقة</p>'+btn('اكشف بطاقتي','reveal()'))}function reveal(){seen=true;panel('<span class="pill">'+esc(names[turn])+'</span>'+(turn===spy?'<div class="secret">إنت الدخيل!</div><p>ما تعرف الكلمة. اسمع تلميحاتهم وحاول تتصرف طبيعي.</p>':'<p>الكلمة السرية هي</p><div class="secret">'+esc(word)+'</div><p>انطي تلميح ذكي، لا تفضح الكلمة.</p>')+btn('خفي البطاقة ومرر التلفون','next()'))}function next(){turn++;if(turn<4)pass();else discussion()}function discussion(){seconds=180;talk();timer=setInterval(()=>{if(seconds>0){seconds--;let t=document.getElementById('clock');if(t)t.textContent=fmt(seconds)}else clearInterval(timer)},1000)}function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function talk(){panel('<span class="pill">وقت السوالف</span><h2>منو تتوقعون الدخيل؟</h2><div class="secret" id="clock">'+fmt(seconds)+'</div><p>كل واحد يوصف الكلمة بدون ما يذكرها. الدخيل يحاول يندمج وياكم.</p>'+btn('يلا نصوّت','vote()')+btn('جولة جديدة','setup()','secondary'))}function vote(){clearInterval(timer);voter=0;votes=[];votePass()}function votePass(){panel('<span class="pill">التصويت • '+(voter+1)+' من ٤</span><h2>دور '+esc(names[voter])+'</h2><p>سلّم التلفون إله حتى يصوّت بالسر</p>'+btn('أصوّت هسه','votePick()'))}function votePick(){panel('<h2>منو الدخيل برأيك؟</h2><p>اختار لاعب غير نفسك</p><div class="choices">'+names.map((n,i)=>i===voter?'':btn(esc(n),'cast('+i+')','secondary')).join('')+'</div>')}function cast(i){votes.push(i);voter++;if(voter<4)votePass();else result()}function result(){let counts=[0,0,0,0];votes.forEach(i=>counts[i]++);let max=Math.max(...counts),winners=counts.map((n,i)=>n===max?i:-1).filter(i=>i>=0);let found=winners.length===1&&winners[0]===spy;panel('<span class="pill">انتهت الجولة</span><h2>'+(found?'مسكتوا الدخيل!':'الدخيل فلت منكم!')+'</h2><div class="secret">'+esc(names[spy])+'</div><p>هو الدخيل! والكلمة كانت <strong>'+esc(word)+'</strong></p><p>الأصوات: '+names.map((n,i)=>esc(n)+' '+counts[i]).join(' • ')+'</p>'+btn('جولة جديدة','setup()'))}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}setup();
</script></html>
