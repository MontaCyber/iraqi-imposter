<style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#202d4b,#101827 65%);color:#f8fafc;font:600 18px system-ui,-apple-system,sans-serif;min-height:100dvh}main{max-width:480px;margin:auto;padding:26px 20px 45px}header{display:flex;align-items:center;gap:12px;margin-bottom:42px}header b{background:#ffdb80;color:#172033;padding:13px 18px;border-radius:20px;font-size:30px}h1{font-size:29px;margin:0}small,p{color:#aab8d2}small{font-size:14px}.panel{border:1px solid #43516c;background:#1c293f;border-radius:24px;padding:24px;text-align:center;min-height:310px;display:flex;flex-direction:column;justify-content:center;gap:15px}h2{font-size:27px;margin:0}p{line-height:1.8;margin:0}button,select,input{font:inherit;border-radius:14px;padding:16px;width:100%;border:1px solid #52627b;background:#293952;color:white}button{cursor:pointer;background:#ffda80;color:#172033;border:0;font-weight:800}button.secondary{background:#34435c;color:#fff}button:disabled{opacity:.5}.stack{display:grid;gap:12px}.secret{font-size:38px;font-weight:900;color:#ffdb80;overflow-wrap:anywhere}.muted{font-size:15px;color:#aab8d2}.pill{background:#2e405d;border-radius:99px;padding:8px 14px;font-size:14px;display:inline-block}footer{text-align:center;color:#72839f;font-size:13px;margin-top:35px}label{display:block;text-align:right;margin-bottom:6px;font-size:15px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choices button{font-size:15px;padding:14px}</style>
<main><header><b>؟</b><div><h1>منو الدخيل؟</h1><small>لعبة السوالف العراقية • من ٣ إلى ١٠ لاعبين</small></div></header><section id="app"></section><footer>تلفون واحد • بدون حساب • العبوا وستانسوا</footer></main>

'أغراض البيت':'ثلاجة،غسالة،طباخ،فرن،مايكرويف،مكيف،مروحة،تلفزيون،ريموت،كنبة،سرير،مخدة،بطانية،سجادة،ستارة،مراية،خزانة،طاولة،كرسي،مصباح،ساعة،باب،شباك،مفتاح،قفل،مكنسة،صابون،شامبو،فرشاة أسنان،منشفة،مقص،سكين،ملعقة،صحن،چدر،استكان،قدح،قنينة،شاحن،بطارية،كيس،علبة،كتاب،قلم،دفتر،حقيبة،حذاء،نعال،جاكيت',

'ملابس وإكسسوارات':'قميص،بنطرون،تيشيرت،فستان،عباية،دشداشة،جاكيت،معطف،قبعة،حجاب،نظارات،نظارات شمسية،ساعة يد،خاتم،سلسلة،سوار،حزام،جوارب،حذاء،نعال،جنطة،محفظة،قفازات،شال،ربطة عنق،بدلة،بيجامة',

'ألوان وأشكال':'أحمر،أزرق،أخضر،أصفر،أسود،أبيض،وردي،بنفسجي،برتقالي،ذهبي،فضي،بني،رمادي،دائرة،مربع،مثلث،نجمة،قلب،سهم،مستطيل،مكعب،كرة،هرم،حلقة'
};const $=document.getElementById('app');let playerCount=5;let names=Array.from({length:5},(_,i)=>'اللاعب '+(i+1)),cat='عشوائي',round=0,word='',spy=0,turn=0,seen=false,votes=[],voter=0,seconds=180,timer=null;const keys=Object.keys(groups);const rand=n=>{if(globalThis.crypto?.getRandomValues){let a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}return Math.floor(Math.random()*n)};let lastSpies=[];let usedWords=new Set();const panel=(html)=>{ $.innerHTML='<div class="panel">'+html+'</div>' };const btn=(s,fn,cls='')=>'<button '+(cls?'class="'+cls+'"':'')+' onclick="'+fn+'">'+s+'</button>';function setup(){clearInterval(timer);panel('<h2>جاهزين للسالفة؟</h2><p>الكل يعرف نفس الكلمة، إلا دخيل واحد ما يعرفها. كل واحد يشوف بطاقته ويخفيها.</p><div class="stack"><label>عدد اللاعبين</label><div class="choices">'+btn('− احذف لاعب','setCount(-1)','secondary')+btn('+ أضف لاعب','setCount(1)')+'</div><span class="pill">'+playerCount+' لاعبين</span><label>اختاروا الموضوع</label><select id="cat"><option>عشوائي</option>'+keys.map(k=>'<option '+(cat===k?'selected':'')+'>'+k+'</option>').join('')+'</select>'+names.map((n,i)=>'<input id="n'+i+'" maxlength="18" value="'+esc(n)+'" aria-label="اسم اللاعب '+(i+1)+'">').join('')+btn('يلا نبدأ','start()')+'</div>')}function setCount(delta){const sel=document.getElementById('cat');if(sel)cat=sel.value;const old=names.map((n,i)=>document.getElementById('n'+i)?.value||n);playerCount=Math.max(3,Math.min(10,playerCount+delta));names=Array.from({length:playerCount},(_,i)=>old[i]||'اللاعب '+(i+1));setup()}function start(){cat=document.getElementById('cat').value;names=names.map((n,i)=>document.getElementById('n'+i).value.trim()||'اللاعب '+(i+1));let list=groups[cat==='عشوائي'?keys[rand(keys.length)]:cat].split('،');let available=list.filter(w=>!usedWords.has(w));if(!available.length){usedWords.clear();available=list.filter(w=>w!==word);if(!available.length)available=list}word=available[rand(available.length)];usedWords.add(word);let candidates=Array.from({length:playerCount},(_,i)=>i).filter(i=>!lastSpies.includes(i));if(!candidates.length)candidates=Array.from({length:playerCount},(_,i)=>i);spy=candidates[rand(candidates.length)];lastSpies.push(spy);if(lastSpies.length>2)lastSpies.shift();turn=0;seen=false;votes=[];voter=0;round++;pass()}function pass(){panel('<span class="pill">الجولة '+round+' • '+(turn+1)+' من ٤</span><h2>سلّم التلفون إلى<br>'+esc(names[turn])+'</h2><p>لا تخلي غيرك يشوف البطاقة</p>'+btn('اكشف بطاقتي','reveal()'))}function reveal(){seen=true;panel('<span class="pill">'+esc(names[turn])+'</span>'+(turn===spy?'<div class="secret">إنت الدخيل!</div><p>ما تعرف الكلمة. اسمع تلميحاتهم وحاول تتصرف طبيعي.</p>':'<p>الكلمة السرية هي</p><div class="secret">'+esc(word)+'</div><p>انطي تلميح ذكي، لا تفضح الكلمة.</p>')+btn('خفي البطاقة ومرر التلفون','next()'))}function next(){turn++;if(turn<playerCount)pass();else discussion()}function discussion(){seconds=180;talk();timer=setInterval(()=>{if(seconds>0){seconds--;let t=document.getElementById('clock');if(t)t.textContent=fmt(seconds)}else clearInterval(timer)},1000)}function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function talk(){panel('<span class="pill">وقت السوالف</span><h2>منو تتوقعون الدخيل؟</h2><div class="secret" id="clock">'+fmt(seconds)+'</div><p>كل واحد يوصف الكلمة بدون ما يذكرها. الدخيل يحاول يندمج وياكم.</p>'+btn('يلا نصوّت','vote()')+btn('جولة جديدة','setup()','secondary'))}function vote(){clearInterval(timer);voter=0;votes=[];votePass()}function votePass(){panel('<span class="pill">التصويت • '+(voter+1)+' من ٤</span><h2>دور '+esc(names[voter])+'</h2><p>سلّم التلفون إله حتى يصوّت بالسر</p>'+btn('أصوّت هسه','votePick()'))}function votePick(){panel('<h2>منو الدخيل برأيك؟</h2><p>اختار لاعب غير نفسك</p><div class="choices">'+names.map((n,i)=>i===voter?'':btn(esc(n),'cast('+i+')','secondary')).join('')+'</div>')}function cast(i){votes.push(i);voter++;if(voter<playerCount)votePass();else result()}function result(){let counts=Array(playerCount).fill(0);votes.forEach(i=>counts[i]++);let max=Math.max(...counts),winners=counts.map((n,i)=>n===max?i:-1).filter(i=>i>=0);let found=winners.length===1&&winners[0]===spy;panel('<span class="pill">انتهت الجولة</span><h2>'+(found?'مسكتوا الدخيل!':'الدخيل فلت منكم!')+'</h2><div class="secret">'+esc(names[spy])+'</div><p>هو الدخيل! والكلمة كانت <strong>'+esc(word)+'</strong></p><p>الأصوات: '+names.map((n,i)=>esc(n)+' '+counts[i]).join(' • ')+'</p>'+btn('جولة جديدة','setup()'))}function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}setup();
</script></html>
