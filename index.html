 const sets=clusters[selectedCategory];
 const recentGroups=new Set(wordHistory.groups.slice(-Math.max(8,sets.length)));
 const freshGroups=sets.map((_,i)=>i).filter(i=>!recentGroups.has(selectedCategory+':'+i));
 const groupPool=freshGroups.length?freshGroups:sets.map((_,i)=>i);
 const groupIndex=groupPool[rand(groupPool.length)];
 const options=sets[groupIndex].split('،');
 const freshWords=options.filter(w=>!wordHistory.words.slice(-120).includes(w));
 const wordPool=freshWords.length?freshWords:options;
 const selectedWord=wordPool[rand(wordPool.length)];
 remember('categories',selectedCategory,6);
 remember('groups',selectedCategory+':'+groupIndex,36);
 remember('words',selectedWord,120);
 saveWordHistory();
 return {category:selectedCategory,groupIndex,word:selectedWord,options};
}
function makeHint(category,groupIndex){
 const groupPool=groupHints[category][groupIndex];
 const broadPool=categoryHints[category];
 const pool=[...groupPool,...groupPool,...broadPool];
 const fresh=pool.filter(h=>!wordHistory.hints.slice(-10).includes(h));
 const opts=fresh.length?fresh:pool;
 const hint=opts[rand(opts.length)];
 remember('hints',hint,15);saveWordHistory();
 return hint;
}
function shuffledPlayers(){let a=Array.from({length:playerCount},(_,i)=>i);for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function nextQuestion(){if(!askQueue.length){askQueue=shuffledPlayers();if(askQueue.length>1&&askQueue[askQueue.length-1]===lastAsker){let i=rand(askQueue.length-1);[askQueue[i],askQueue[askQueue.length-1]]=[askQueue[askQueue.length-1],askQueue[i]]}}asker=askQueue.pop();let possible=Array.from({length:playerCount},(_,i)=>i).filter(i=>i!==asker&&asker+':'+i!==lastPair);if(!possible.length)possible=Array.from({length:playerCount},(_,i)=>i).filter(i=>i!==asker);asked=possible[rand(possible.length)];lastAsker=asker;lastPair=asker+':'+asked;askTurn++}
function saveScores(){try{localStorage.setItem('imposterScores',JSON.stringify(scores))}catch(e){}}function scoreboard(){return '<h2>لوحة النقاط</h2><div class="stack">'+names.map(n=>'<div class="scoreline"><span>'+esc(n)+'</span><strong>'+Number(scores[n]||0)+' نقطة</strong></div>').join('')+'</div>'}const panel=(html)=>{ $.innerHTML='<div class="panel">'+html+'</div>' };const btn=(s,fn,cls='')=>'<button '+(cls?'class="'+cls+'"':'')+' onclick="'+fn+'">'+s+'</button>';function setup(){clearInterval(timer);panel('<h2>جاهزين للسالفة؟</h2><p>الكل يعرف نفس الكلمة، إلا دخيل واحد ما يعرفها. كل واحد يشوف بطاقته ويخفيها.</p><div class="stack"><label>عدد اللاعبين</label><div class="choices">'+btn('− احذف لاعب','setCount(-1)','secondary')+btn('+ أضف لاعب','setCount(1)')+'</div><span class="pill">'+playerCount+' لاعبين</span><label>اختاروا الموضوع</label><select id="cat"><option>عشوائي</option>'+keys.map(k=>'<option '+(cat===k?'selected':'')+'>'+k+'</option>').join('')+'</select>'+names.map((n,i)=>'<input id="n'+i+'" maxlength="18" value="'+esc(n)+'" aria-label="اسم اللاعب '+(i+1)+'">').join('')+scoreboard()+btn('يلا نبدأ','start()')+btn('تصفير النقاط','resetScores()','secondary')+'</div>')}function setCount(delta){const sel=document.getElementById('cat');if(sel)cat=sel.value;const old=names.map((n,i)=>document.getElementById('n'+i)?.value||n);playerCount=Math.max(3,Math.min(10,playerCount+delta));names=Array.from({length:playerCount},(_,i)=>old[i]||'اللاعب '+(i+1));setup()}function start(){
 cat=document.getElementById('cat').value;
 names=names.map((n,i)=>document.getElementById('n'+i).value.trim()||'اللاعب '+(i+1));
 const selected=chooseWord();
 pickedCategory=selected.category;
 word=selected.word;
 roundHint=makeHint(selected.category,selected.groupIndex);
 let pool=selected.options.filter(w=>w!==word);
 for(let i=pool.length-1;i>0;i--){let j=rand(i+1);[pool[i],pool[j]]=[pool[j],pool[i]]}
 guessOptions=[word,...pool.slice(0,5)];
 for(let i=guessOptions.length-1;i>0;i--){let j=rand(i+1);[guessOptions[i],guessOptions[j]]=[guessOptions[j],guessOptions[i]]}
 spy=nextSpy();turn=0;seen=false;votes=[];voter=0;round++;askQueue=[];lastAsker=-1;lastPair='';askTurn=0;pass();
}
function pass(){panel('<span class="pill">الجولة '+round+' • '+(turn+1)+' من '+playerCount+'</span><h2>سلّم التلفون إلى<br>'+esc(names[turn])+'</h2><p>لا تخلي غيرك يشوف البطاقة</p>'+btn('اكشف بطاقتي','reveal()'))}function reveal(){seen=true;panel('<span class="pill">'+esc(names[turn])+'</span>'+(turn===spy?'<div class="secret">إنت الدخيل!</div><p>ما تعرف الكلمة، بس عندك تلميح عام:</p><div class="hint">'+esc(roundHint)+'</div><p>اسمع تلميحاتهم وحاول تتصرف طبيعي.</p>':'<p>الكلمة السرية هي</p><div class="secret">'+esc(word)+'</div><p>تلميح عام: '+esc(roundHint)+'</p><p>انطي تلميح ذكي، لا تفضح الكلمة.</p>')+btn('خفي البطاقة ومرر التلفون','next()'))}function next(){turn++;if(turn<playerCount)pass();else discussion()}function discussion(){seconds=180;nextQuestion();talk();timer=setInterval(()=>{if(seconds>0){seconds--;let t=document.getElementById('clock');if(t)t.textContent=fmt(seconds)}else clearInterval(timer)},1000)}function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function talk(){panel('<span class="pill">وقت السوالف • السؤال '+askTurn+'</span><h2>منو يسأل من؟</h2><div class="ask-pair"><strong>'+esc(names[asker])+'</strong><span>يسأل</span><strong>'+esc(names[asked])+'</strong></div><p>اسأله عن الكلمة بدون ما تذكرها، وخلي الجواب ذكي!</p><div class="secret" id="clock">'+fmt(seconds)+'</div>'+btn('مرر السؤال لشخص ثاني','nextTalk()')+btn('يلا نخمن الكلمة','guessPass()','secondary')+btn('جولة جديدة','setup()','secondary'))}function nextTalk(){nextQuestion();talk()}
function vote(){clearInterval(timer);voter=0;votes=[];votePass()}function votePass(){panel('<span class="pill">التصويت • '+(voter+1)+' من ٤</span><h2>دور '+esc(names[voter])+'</h2><p>سلّم التلفون إله حتى يصوّت بالسر</p>'+btn('أصوّت هسه','votePick()'))}function votePick(){panel('<h2>منو الدخيل برأيك؟</h2><p>اختار لاعب غير نفسك</p><div class="choices">'+names.map((n,i)=>i===voter?'':btn(esc(n),'cast('+i+')','secondary')).join('')+'</div>')}function cast(i){votes.push(i);voter++;if(voter<playerCount)votePass();else result()}function result(){let counts=Array(playerCount).fill(0);votes.forEach(i=>counts[i]++);let max=Math.max(...counts),winners=counts.map((n,i)=>n===max?i:-1).filter(i=>i>=0);found=winners.length===1&&winners[0]===spy;panel('<span class="pill">نتيجة التصويت</span><h2>'+(found?'مسكتوا الدخيل!':'ما اتفقتوا على الدخيل!')+'</h2><p>الدخيل هو <strong>'+esc(names[spy])+'</strong></p><p>الأصوات: '+names.map((n,i)=>esc(n)+' '+counts[i]).join(' • ')+'</p><p>بس بعد عنده فرصة يخمّن الكلمة ويفوز!</p>'+btn('سلّم التلفون للدخيل','guessPass()'))}
function guessPass(){clearInterval(timer);panel('<h2>دور '+esc(names[spy])+'</h2><p>الدخيل عنده محاولة وحدة يختار من ٦ كلمات. لا أحد يساعده!</p>'+btn('شوف الخيارات','guessScreen()'))}
function guessScreen(){panel('<span class="pill">تحدي الدخيل</span><h2>شنو الكلمة السرية؟</h2><p>اختار وحدة من هاي الكلمات الستة</p><div class="choices">'+guessOptions.map((w,i)=>btn(esc(w),'finish('+i+')','secondary')).join('')+'</div>')}
function finish(i){const correct=guessOptions[i]===word;if(correct){scores[names[spy]]=(scores[names[spy]]||0)+3}else{names.forEach((n,j)=>{if(j!==spy)scores[n]=(scores[n]||0)+2})}saveScores();panel('<span class="pill">نهاية الجولة '+round+'</span><h2>'+(correct?'الدخيل خمّنها صح!':'الفريق فاز!')+'</h2><p>الكلمة كانت</p><div class="secret">'+esc(word)+'</div><p>'+(correct?'الدخيل +٣ نقاط':'كل لاعب مو دخيل +٢ نقاط')+'</p>'+scoreboard()+btn('جولة جديدة','setup()')+btn('تصفير النقاط','resetScores()','secondary'))}
function resetScores(){if(!confirm('متأكد تريد تصفّر كل النقاط؟'))return;scores={};saveScores();setup()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}setup();
</script></html>
