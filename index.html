<main><header><b>؟</b><div><h1>منو الدخيل؟</h1><small>لعبة السوالف العراقية • من ٣ إلى ١٠ لاعبين</small></div></header><section id="app"></section><footer>تلفون واحد • بدون حساب • العبوا وستانسوا</footer></main>
<script>
const clusters={"حيوانات":["أسد،نمر،دب،ذئب،ثعلب،فهد،ضبع","بقرة،خروف،ماعز،حصان،حمار،جمل،ثور","كلب،قطو،أرنب،فأر،سنجاب،قنفذ،قرد","فيل،زرافة،غوريلا،كنغر،باندا،غزال،حمار وحشي،فرس النهر","دجاجة،بطة،حمامة،عصفور،ببغاء،نسر،صقر،بومة،نعامة،بطريق،طاووس","سمچة،قرش،حوت،دلفين،أخطبوط،روبيان","تمساح،ثعبان،سلحفاة،ضفدع،وزغة،سحلية","نملة،نحلة،فراشة،صرصور،بعوضة،ذبابة،عنكبوت"],"أكل وشرب":["دولمة،برياني،كباب،مسگوف،باجة،تشريب،قيمة،كبة،فلافل،شاورما","بيتزا،برگر،معكرونة،اندومي،بطاطا مقلية،ساندويچ،دجاج مقلي،نقانق","كليجة،كاهي،گيمر،كيك،بسكوت،آيس كريم،شوكولاتة،فشار،شيبس،بقلاوة،دونات","تفاح،موز،برتقال،ليمون،عنب،رمان،فراولة،مانگو،رگي،بطيخ،تمر،تين،خوخ،مشمش،أناناس،كرز","بطاطا،طماطة،خيار،جزر،بصل،ثوم،باذنجان،خس،فلفل،بامية،سبانخ","رز،خبز،صمون،جبن،بيض،عسل،لبن،حليب،زبدة","چاي،قهوة،عصير،بيبسي،ماي،ليمونادة،كاكاو،شاي بالحليب"],"أغراض البيت":["ثلاجة،غسالة،طباخ غاز،فرن،مايكرويف،مكيف،مروحة،مكنسة،مكواة،مجفف شعر","كنبة،سرير،مخدة،بطانية،سجادة،ستارة،خزانة،طاولة،كرسي،مراية،مصباح،ساعة حائط","چدر،مقلاة،صحن،ملعقة،شوكة،سكين،استكان،قدح،قنينة،إبريق،دلة","باب،شباك،مفتاح،قفل،منشفة،صابون،شامبو،فرشاة أسنان،مشط،عطر،جرس","سلة مهملات،ممسحة،دلو،إسفنجة،كيس،علبة،شمعة،ولاعة،مرشة ماي"],"أغراض المدرسة":["قلم،قلم رصاص،قلم حبر،ممحاة،مسطرة،براية،مقلمة،دفتر،كتاب","سبورة،طباشير،ممحاة سبورة،ورقة،حقيبة مدرسية،ملصق،لاصق،مقص،دباسة"],"أماكن":["مدرسة،جامعة،مستشفى،صيدلية،عيادة،مركز شرطة،محكمة،بنك،مكتب","مطعم،مقهى،مول،سوق،سوبرماركت،مخبز،محل حلاقة،محل ملابس،محل حلويات","حديقة،ملعب،سينما،مدينة ألعاب،مسبح،حديقة حيوان،متحف،مكتبة،صالة رياضية","مطار،محطة قطار،گراج،فندق،محطة وقود،مغسلة سيارات،ورشة سيارات،جسر،نفق","بيت،مطبخ،حمام،غرفة نوم،سطح،مصعد،شارع،رصيف،شرفة"],"مواصلات":["سيارة،تكسي،باص،شاحنة،تكتك،دراجة،دراجة نارية،سكوتر،تراكتور","طيارة،هليكوبتر،قطار،مترو،سفينة،زورق،قارب،غواصة،صاروخ","إسعاف،سيارة إطفاء،سيارة شرطة،سيارة سباق،باص مدرسة،سيارة نقل،سيارة كهربائية،عربة خيل"],"طبيعة وطقس":["شمس،قمر،نجمة،غيمة،مطر،ثلج،ريح،ضباب،برق،رعد،قوس قزح","حر،برد،غبار،عاصفة،شروق،غروب،فيضان،زلزال،بركان","بحر،نهر،بحيرة،شلال،جبل،صحراء،غابة،جزيرة،كهف","شجرة،نخلة،وردة،عشب،رمل،طين،حجر،نار،دخان"],"ملابس وإكسسوارات":["قميص،تيشيرت،بنطرون،فستان،عباية،دشداشة،جاكيت،هودي،شورت،جينز،تنورة","قبعة،حجاب،شماغ،عقال،كمامة،خوذة،شال،ربطة عنق،قفازات","نظارات،نظارات شمسية،ساعة يد،خاتم،سلسلة،سوار،حزام،محفظة","حذاء،نعال،جوارب،بوت،صندل،جنطة،حقيبة ظهر،حقيبة سفر","بدلة،بيجامة،معطف،كنزة،بدلة رياضية،زي مدرسي"],"رياضة وألعاب":["كرة قدم،كرة سلة،كرة طائرة،كرة يد،تنس،تنس طاولة،ريشة طائرة","سباحة،ملاكمة،مصارعة،ركض،سباق سيارات،رفع أثقال،جمباز،تزلج،جيم","شطرنج،دومينو،طاولة زهر،بليارد،بولينگ،ورق لعب،نرد،لعبة الغميضة","حكم،حارس مرمى،جمهور،مرمى،صفارة،مضرب،كأس،ميدالية،ركلة جزاء"],"تكنولوجيا":["موبايل،لابتوب،كمبيوتر،تابلت،ساعة ذكية،آلة حاسبة،تلفزيون،بلايستيشن","كيبورد،ماوس،سماعات،مايكروفون،كاميرا،طابعة،شاشة،ريموت،يد تحكم","راوتر،واي فاي،بلوتوث،شاحن،باور بانك،فلاش ميموري،كرت ذاكرة،بطارية،سلك شحن","إنستغرام،تيك توك،واتساب،يوتيوب،سناب چات،گوگل،فيسبوك،تيليگرام"],"مهن وشخصيات":["طبيب،طبيب أسنان،طبيب بيطري،ممرض،صيدلي،مسعف،جراح","مهندس،مدرس،محامي،قاضي،شرطي،جندي،مدير،محاسب،موظف بنك","طباخ،حلاق،نجار،حداد،خباز،خياط،سباك،كهربائي،ميكانيكي","مزارع،صياد،سائق،طيار،رجل إطفاء،حارس،بائع،عامل بناء،عامل تنظيف","مصور،مغني،ممثل،رسام،لاعب كرة،حكم رياضي،مذيع،كاتب،صحفي"],"أشياء خيالية":["تنين،زومبي،شبح،فضائي،ديناصور،ساحر،مصاص دماء،مومياء،وحش،جني","حورية بحر،بساط طائر،عصا سحرية،سفينة فضائية،آلة زمن،كنز،قلعة،سيف،درع،قرصان،بطل خارق"]};const groups=Object.fromEntries(Object.entries(clusters).map(([k,sets])=>[k,sets.join('،')]));const $=document.getElementById('app');let playerCount=5;let names=Array.from({length:5},(_,i)=>'اللاعب '+(i+1)),cat='عشوائي',round=0,word='',spy=0,turn=0,seen=false,votes=[],voter=0,seconds=180,timer=null;const keys=Object.keys(groups);const rand=n=>{if(globalThis.crypto?.getRandomValues){let a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}return Math.floor(Math.random()*n)};let spyBag=[],spyBagSize=0,lastSpy=-1;function nextSpy(){if(spyBagSize!==playerCount){spyBag=[];spyBagSize=playerCount;lastSpy=-1}if(!spyBag.length){spyBag=Array.from({length:playerCount},(_,i)=>i);for(let i=spyBag.length-1;i>0;i--){let j=rand(i+1);[spyBag[i],spyBag[j]]=[spyBag[j],spyBag[i]]}if(spyBag.length>1&&spyBag[spyBag.length-1]===lastSpy){let j=rand(spyBag.length-1);[spyBag[j],spyBag[spyBag.length-1]]=[spyBag[spyBag.length-1],spyBag[j]]}}lastSpy=spyBag.pop();return lastSpy}let lastSpies=[];let usedWords=new Set();let scores={};try{scores=JSON.parse(localStorage.getItem('imposterScores')||'{}')}catch(e){}let pickedCategory='',guessOptions=[],found=false,roundHint='',askQueue=[],asker=-1,asked=-1,lastAsker=-1,lastPair='',askTurn=0;const hintTopics={'حيوانات':'الحيوانات','أكل وشرب':'الأكل والشرب','أغراض البيت':'أغراض البيت','أماكن':'الأماكن','مواصلات':'المواصلات','طبيعة وطقس':'الطبيعة','ملابس وإكسسوارات':'اللبس والإكسسوارات','رياضة وألعاب':'الرياضة والألعاب','تكنولوجيا':'التكنولوجيا','مهن وشخصيات':'المهن والشخصيات','أشياء خيالية':'الخيال','ألوان وأشكال':'الألوان والأشكال','أشياء نستخدمها كل يوم':'الأشياء اليومية','أشياء تنأكل أو تنشرب':'الأكل والشرب','أغراض المدرسة':'المدرسة والقرطاسية'};
function makeHint(w){let cats=keys.filter(k=>groups[k].split('،').includes(w));let specific=cats.filter(k=>!['أشياء نستخدمها كل يوم','أشياء تنأكل أو تنشرب','أماكن'].includes(k));let choices=specific.length?specific:cats;let topic=hintTopics[choices[rand(choices.length)]]||'الحياة اليومية';return ['إله علاقة بـ '+topic,'فكّر بشي من عالم '+topic,'التلميح العام: '+topic][rand(3)]}
function shuffledPlayers(){let a=Array.from({length:playerCount},(_,i)=>i);for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function nextQuestion(){if(!askQueue.length){askQueue=shuffledPlayers();if(askQueue.length>1&&askQueue[askQueue.length-1]===lastAsker){let i=rand(askQueue.length-1);[askQueue[i],askQueue[askQueue.length-1]]=[askQueue[askQueue.length-1],askQueue[i]]}}asker=askQueue.pop();let possible=Array.from({length:playerCount},(_,i)=>i).filter(i=>i!==asker&&asker+':'+i!==lastPair);if(!possible.length)possible=Array.from({length:playerCount},(_,i)=>i).filter(i=>i!==asker);asked=possible[rand(possible.length)];lastAsker=asker;lastPair=asker+':'+asked;askTurn++}
function saveScores(){try{localStorage.setItem('imposterScores',JSON.stringify(scores))}catch(e){}}function scoreboard(){return '<h2>لوحة النقاط</h2><div class="stack">'+names.map(n=>'<div class="scoreline"><span>'+esc(n)+'</span><strong>'+Number(scores[n]||0)+' نقطة</strong></div>').join('')+'</div>'}const panel=(html)=>{ $.innerHTML='<div class="panel">'+html+'</div>' };const btn=(s,fn,cls='')=>'<button '+(cls?'class="'+cls+'"':'')+' onclick="'+fn+'">'+s+'</button>';function setup(){clearInterval(timer);panel('<h2>جاهزين للسالفة؟</h2><p>الكل يعرف نفس الكلمة، إلا دخيل واحد ما يعرفها. كل واحد يشوف بطاقته ويخفيها.</p><div class="stack"><label>عدد اللاعبين</label><div class="choices">'+btn('− احذف لاعب','setCount(-1)','secondary')+btn('+ أضف لاعب','setCount(1)')+'</div><span class="pill">'+playerCount+' لاعبين</span><label>اختاروا الموضوع</label><select id="cat"><option>عشوائي</option>'+keys.map(k=>'<option '+(cat===k?'selected':'')+'>'+k+'</option>').join('')+'</select>'+names.map((n,i)=>'<input id="n'+i+'" maxlength="18" value="'+esc(n)+'" aria-label="اسم اللاعب '+(i+1)+'">').join('')+scoreboard()+btn('يلا نبدأ','start()')+btn('تصفير النقاط','resetScores()','secondary')+'</div>')}function setCount(delta){const sel=document.getElementById('cat');if(sel)cat=sel.value;const old=names.map((n,i)=>document.getElementById('n'+i)?.value||n);playerCount=Math.max(3,Math.min(10,playerCount+delta));names=Array.from({length:playerCount},(_,i)=>old[i]||'اللاعب '+(i+1));setup()}function start(){cat=document.getElementById('cat').value;names=names.map((n,i)=>document.getElementById('n'+i).value.trim()||'اللاعب '+(i+1));pickedCategory=cat;let list=cat==='عشوائي'?[...new Set(keys.flatMap(k=>groups[k].split('،')))]:groups[cat].split('،');let available=list.filter(w=>!usedWords.has(w));if(!available.length){usedWords.clear();available=list.filter(w=>w!==word);if(!available.length)available=list}word=available[rand(available.length)];roundHint=makeHint(word);usedWords.add(word);let selected=Object.values(clusters).flat().find(set=>set.split('،').includes(word));let pool=selected.split('،').filter(w=>w!==word);for(let i=pool.length-1;i>0;i--){let j=rand(i+1);[pool[i],pool[j]]=[pool[j],pool[i]]}guessOptions=[word,...pool.slice(0,5)];for(let i=guessOptions.length-1;i>0;i--){let j=rand(i+1);[guessOptions[i],guessOptions[j]]=[guessOptions[j],guessOptions[i]]}spy=nextSpy();turn=0;seen=false;votes=[];voter=0;round++;askQueue=[];lastAsker=-1;lastPair='';askTurn=0;pass()}function pass(){panel('<span class="pill">الجولة '+round+' • '+(turn+1)+' من '+playerCount+'</span><h2>سلّم التلفون إلى<br>'+esc(names[turn])+'</h2><p>لا تخلي غيرك يشوف البطاقة</p>'+btn('اكشف بطاقتي','reveal()'))}function reveal(){seen=true;panel('<span class="pill">'+esc(names[turn])+'</span>'+(turn===spy?'<div class="secret">إنت الدخيل!</div><p>ما تعرف الكلمة، بس عندك تلميح عام:</p><div class="hint">'+esc(roundHint)+'</div><p>اسمع تلميحاتهم وحاول تتصرف طبيعي.</p>':'<p>الكلمة السرية هي</p><div class="secret">'+esc(word)+'</div><p>تلميح عام: '+esc(roundHint)+'</p><p>انطي تلميح ذكي، لا تفضح الكلمة.</p>')+btn('خفي البطاقة ومرر التلفون','next()'))}function next(){turn++;if(turn<playerCount)pass();else discussion()}function discussion(){seconds=180;nextQuestion();talk();timer=setInterval(()=>{if(seconds>0){seconds--;let t=document.getElementById('clock');if(t)t.textContent=fmt(seconds)}else clearInterval(timer)},1000)}function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function talk(){panel('<span class="pill">وقت السوالف • السؤال '+askTurn+'</span><h2>منو يسأل من؟</h2><div class="ask-pair"><strong>'+esc(names[asker])+'</strong><span>يسأل</span><strong>'+esc(names[asked])+'</strong></div><p>اسأله عن الكلمة بدون ما تذكرها، وخلي الجواب ذكي!</p><div class="secret" id="clock">'+fmt(seconds)+'</div>'+btn('مرر السؤال لشخص ثاني','nextTalk()')+btn('يلا نخمن الكلمة','guessPass()','secondary')+btn('جولة جديدة','setup()','secondary'))}function nextTalk(){nextQuestion();talk()}
function vote(){clearInterval(timer);voter=0;votes=[];votePass()}function votePass(){panel('<span class="pill">التصويت • '+(voter+1)+' من ٤</span><h2>دور '+esc(names[voter])+'</h2><p>سلّم التلفون إله حتى يصوّت بالسر</p>'+btn('أصوّت هسه','votePick()'))}function votePick(){panel('<h2>منو الدخيل برأيك؟</h2><p>اختار لاعب غير نفسك</p><div class="choices">'+names.map((n,i)=>i===voter?'':btn(esc(n),'cast('+i+')','secondary')).join('')+'</div>')}function cast(i){votes.push(i);voter++;if(voter<playerCount)votePass();else result()}function result(){let counts=Array(playerCount).fill(0);votes.forEach(i=>counts[i]++);let max=Math.max(...counts),winners=counts.map((n,i)=>n===max?i:-1).filter(i=>i>=0);found=winners.length===1&&winners[0]===spy;panel('<span class="pill">نتيجة التصويت</span><h2>'+(found?'مسكتوا الدخيل!':'ما اتفقتوا على الدخيل!')+'</h2><p>الدخيل هو <strong>'+esc(names[spy])+'</strong></p><p>الأصوات: '+names.map((n,i)=>esc(n)+' '+counts[i]).join(' • ')+'</p><p>بس بعد عنده فرصة يخمّن الكلمة ويفوز!</p>'+btn('سلّم التلفون للدخيل','guessPass()'))}
function guessPass(){clearInterval(timer);panel('<h2>دور '+esc(names[spy])+'</h2><p>الدخيل عنده محاولة وحدة يختار من ٦ كلمات. لا أحد يساعده!</p>'+btn('شوف الخيارات','guessScreen()'))}
function guessScreen(){panel('<span class="pill">تحدي الدخيل</span><h2>شنو الكلمة السرية؟</h2><p>اختار وحدة من هاي الكلمات الستة</p><div class="choices">'+guessOptions.map((w,i)=>btn(esc(w),'finish('+i+')','secondary')).join('')+'</div>')}
function finish(i){const correct=guessOptions[i]===word;if(correct){scores[names[spy]]=(scores[names[spy]]||0)+3}else{names.forEach((n,j)=>{if(j!==spy)scores[n]=(scores[n]||0)+2})}saveScores();panel('<span class="pill">نهاية الجولة '+round+'</span><h2>'+(correct?'الدخيل خمّنها صح!':'الفريق فاز!')+'</h2><p>الكلمة كانت</p><div class="secret">'+esc(word)+'</div><p>'+(correct?'الدخيل +٣ نقاط':'كل لاعب مو دخيل +٢ نقاط')+'</p>'+scoreboard()+btn('جولة جديدة','setup()')+btn('تصفير النقاط','resetScores()','secondary'))}
function resetScores(){if(!confirm('متأكد تريد تصفّر كل النقاط؟'))return;scores={};saveScores();setup()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}setup();
</script></html>
