<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>منو الدخيل؟</title>
<style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#202d4b,#101827 65%);color:#f8fafc;font:600 18px system-ui,-apple-system,sans-serif;min-height:100dvh}main{max-width:480px;margin:auto;padding:26px 20px 45px}header{display:flex;align-items:center;gap:12px;margin-bottom:42px}header b{background:#ffdb80;color:#172033;padding:13px 18px;border-radius:20px;font-size:30px}h1{font-size:29px;margin:0}small,p{color:#aab8d2}small{font-size:14px}.panel{border:1px solid #43516c;background:#1c293f;border-radius:24px;padding:24px;text-align:center;min-height:310px;display:flex;flex-direction:column;justify-content:center;gap:15px}h2{font-size:27px;margin:0}p{line-height:1.8;margin:0}button,select,input{font:inherit;border-radius:14px;padding:16px;width:100%;border:1px solid #52627b;background:#293952;color:white}button{cursor:pointer;background:#ffda80;color:#172033;border:0;font-weight:800}button.secondary{background:#34435c;color:#fff}button:disabled{opacity:.5}.stack{display:grid;gap:12px}.secret{font-size:38px;font-weight:900;color:#ffdb80;overflow-wrap:anywhere}.muted{font-size:15px;color:#aab8d2}.pill{background:#2e405d;border-radius:99px;padding:8px 14px;font-size:14px;display:inline-block}footer{text-align:center;color:#72839f;font-size:13px;margin-top:35px}label{display:block;text-align:right;margin-bottom:6px;font-size:15px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choices button{font-size:15px;padding:14px}.scoreline{display:flex;justify-content:space-between;gap:12px;background:#283952;border-radius:12px;padding:11px 14px;font-size:15px}.scoreline strong{color:#ffda80}.hint{background:#334765;border:1px solid #6884a6;border-radius:16px;padding:17px;color:#ffda80;font-size:22px;line-height:1.6}.ask-pair{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;background:#283c59;border-radius:16px;padding:16px}.ask-pair strong{font-size:23px;color:#ffda80}.ask-pair span{font-size:16px;color:#cbd5e1}</style>
<main><header><b>؟</b><div><h1>منو الدخيل؟</h1><small>لعبة السوالف العراقية • من ٣ إلى ١٠ لاعبين</small></div></header><section id="app"></section><footer>تلفون واحد • بدون حساب • العبوا وستانسوا</footer></main>
<script src="./word-bank.js"></script>
<script>
const bank=window.IMPOSTER_BANK;
if(!bank||!Array.isArray(bank.categories))throw Error('Word bank unavailable');
const groups=Object.fromEntries(bank.categories.map(c=>[c.name,c.groups]));
const allWords=bank.categories.flatMap(c=>c.groups.flatMap(g=>g.words));
const $=document.getElementById('app');let playerCount=5;let names=Array.from({length:5},(_,i)=>'اللاعب '+(i+1)),cat='عشوائي',round=0,word='',spy=0,turn=0,seen=false,votes=[],voter=0,seconds=180,timer=null;const keys=Object.keys(groups);const rand=n=>{if(globalThis.crypto?.getRandomValues){let a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}return Math.floor(Math.random()*n)};let spyBag=[],spyBagSize=0,lastSpy=-1;function nextSpy(){if(spyBagSize!==playerCount){spyBag=[];spyBagSize=playerCount;lastSpy=-1}if(!spyBag.length){spyBag=Array.from({length:playerCount},(_,i)=>i);for(let i=spyBag.length-1;i>0;i--){let j=rand(i+1);[spyBag[i],spyBag[j]]=[spyBag[j],spyBag[i]]}if(spyBag.length>1&&spyBag[spyBag.length-1]===lastSpy){let j=rand(spyBag.length-1);[spyBag[j],spyBag[spyBag.length-1]]=[spyBag[spyBag.length-1],spyBag[j]]}}lastSpy=spyBag.pop();return lastSpy}let lastSpies=[];let scores={};try{scores=JSON.parse(localStorage.getItem('imposterScores')||'{}')}catch(e){}let pickedCategory='',guessOptions=[],found=false,roundHint='',spyQuestions=[],askQueue=[],asker=-1,asked=-1,lastAsker=-1,lastPair='',askTurn=0;const CYCLE_KEY='imposterCycleV3';
function emptyCycle(){return {used:[],categoryCounts:{},groupCounts:{},recentCategories:[],recentGroups:[],recentQuestions:[]}}
let cycle=emptyCycle();
try{const saved=JSON.parse(localStorage.getItem(CYCLE_KEY)||'null');
if(saved&&Array.isArray(saved.used)){const valid=new Set(allWords);
cycle={...emptyCycle(),...saved,used:[...new Set(saved.used.filter(w=>typeof w==='string'&&valid.has(w)))],
categoryCounts:saved.categoryCounts&&typeof saved.categoryCounts==='object'?saved.categoryCounts:{},
groupCounts:saved.groupCounts&&typeof saved.groupCounts==='object'?saved.groupCounts:{},
recentCategories:Array.isArray(saved.recentCategories)?saved.recentCategories.slice(-4):[],
recentGroups:Array.isArray(saved.recentGroups)?saved.recentGroups.slice(-8):[],
recentQuestions:Array.isArray(saved.recentQuestions)?saved.recentQuestions.slice(-32):[]}}}catch(e){}
function saveCycle(){try{localStorage.setItem(CYCLE_KEY,JSON.stringify(cycle))}catch(e){}}
function remainingFor(category){const used=new Set(cycle.used);return (category==='عشوائي'?allWords:groups[category]?.flatMap(g=>g.words)||[]).filter(w=>!used.has(w)).length}
function updateWordCounter(){const el=document.getElementById('wordCounter'),sel=document.getElementById('cat');
if(el){const c=sel?.value||cat;el.textContent='كلمات جديدة بدون تكرار: '+remainingFor(c)+' / '+(c==='عشوائي'?allWords.length:(groups[c]||[]).flatMap(g=>g.words).length)}}
function restartWords(){if(!confirm('راح ترجع كل الكلمات للبداية وممكن تتكرر من جديد. متأكد؟'))return;cycle=emptyCycle();saveCycle();setup()}
function pickLeast(items,counts,history){const lowest=Math.min(...items.map(x=>counts[x]||0));const ties=items.filter(x=>(counts[x]||0)===lowest),fresh=ties.filter(x=>!history.includes(x)),pool=fresh.length?fresh:ties;return pool[rand(pool.length)]}
function chooseWord(){const used=new Set(cycle.used),allowed=cat==='عشوائي'?keys:[cat];
const active=allowed.filter(c=>(groups[c]||[]).some(g=>g.words.some(w=>!used.has(w))));
if(!active.length)return null;
const category=pickLeast(active,cycle.categoryCounts,cycle.recentCategories.slice(-2));
const available=groups[category].map((group,index)=>({group,index,id:category+':'+index,unused:group.words.filter(w=>!used.has(w))})).filter(g=>g.unused.length);
const id=pickLeast(available.map(g=>g.id),cycle.groupCounts,cycle.recentGroups.slice(-4));
const g=available.find(g=>g.id===id),word=g.unused[rand(g.unused.length)];
cycle.used.push(word);cycle.categoryCounts[category]=(cycle.categoryCounts[category]||0)+1;
cycle.groupCounts[id]=(cycle.groupCounts[id]||0)+1;
cycle.recentCategories.push(category);cycle.recentCategories=cycle.recentCategories.slice(-4);
cycle.recentGroups.push(id);cycle.recentGroups=cycle.recentGroups.slice(-8);saveCycle();
return {category,word,group:g.group,groupIndex:g.index}}
function makeSpyHint(group){
const choices=[...(bank.questions[group.questionSet]||[])],available=choices.filter(q=>!cycle.recentQuestions.includes(q));
const q=available.length>=2?available:choices,examples=[];
while(examples.length<2&&q.length){examples.push(q.splice(rand(q.length),1)[0])}
cycle.recentQuestions.push(...examples);cycle.recentQuestions=cycle.recentQuestions.slice(-32);saveCycle();
return {clue:group.hint,examples}}
function shuffledPlayers(){let a=Array.from({length:playerCount},(_,i)=>i);for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function nextQuestion(){if(!askQueue.length){askQueue=shuffledPlayers();if(askQueue.length>1&&askQueue[askQueue.length-1]===lastAsker){let i=rand(askQueue.length-1);[askQueue[i],askQueue[askQueue.length-1]]=[askQueue[askQueue.length-1],askQueue[i]]}}asker=askQueue.pop();let possible=Array.from({length:playerCount},(_,i)=>i).filter(i=>i!==asker&&asker+':'+i!==lastPair);if(!possible.length)possible=Array.from({length:playerCount},(_,i)=>i).filter(i=>i!==asker);asked=possible[rand(possible.length)];lastAsker=asker;lastPair=asker+':'+asked;askTurn++}
function saveScores(){try{localStorage.setItem('imposterScores',JSON.stringify(scores))}catch(e){}}function scoreboard(){return '<h2>لوحة النقاط</h2><div class="stack">'+names.map(n=>'<div class="scoreline"><span>'+esc(n)+'</span><strong>'+Number(scores[n]||0)+' نقطة</strong></div>').join('')+'</div>'}const panel=(html)=>{ $.innerHTML='<div class="panel">'+html+'</div>' };const btn=(s,fn,cls='')=>'<button '+(cls?'class="'+cls+'"':'')+' onclick="'+fn+'">'+s+'</button>';function setup(){clearInterval(timer);panel('<h2>جاهزين للسالفة؟</h2><p>الكل يعرف نفس الكلمة، إلا دخيل واحد ما يعرفها. كل واحد يشوف بطاقته ويخفيها.</p><div class="stack"><label>عدد اللاعبين</label><div class="choices">'+btn('− احذف لاعب','setCount(-1)','secondary')+btn('+ أضف لاعب','setCount(1)')+'</div><span class="pill">'+playerCount+' لاعبين</span><label>اختاروا الموضوع</label><select id="cat" onchange="updateWordCounter()"><option>عشوائي</option>'+keys.map(k=>'<option '+(cat===k?'selected':'')+'>'+k+'</option>').join('')+'</select><span class="muted" id="wordCounter"></span>'+names.map((n,i)=>'<input id="n'+i+'" maxlength="18" value="'+esc(n)+'" aria-label="اسم اللاعب '+(i+1)+'">').join('')+scoreboard()+btn('يلا نبدأ','start()')+btn('تصفير النقاط','resetScores()','secondary')+'</div>');updateWordCounter()}function setCount(delta){const sel=document.getElementById('cat');if(sel)cat=sel.value;const old=names.map((n,i)=>document.getElementById('n'+i)?.value||n);playerCount=Math.max(3,Math.min(10,playerCount+delta));names=Array.from({length:playerCount},(_,i)=>old[i]||'اللاعب '+(i+1));setup()}function start(){
cat=document.getElementById('cat').value;names=names.map((n,i)=>document.getElementById('n'+i).value.trim()||'اللاعب '+(i+1));
const selected=chooseWord();
if(!selected){panel('<h2>خلصت الكلمات الجديدة!</h2><p>لعبتوا كل الكلمات المتوفرة بهالفئة بدون تكرار. اختاروا فئة ثانية، أو رجّعوا الكلمات للبداية بإرادتكم.</p>'+btn('اختار فئة ثانية','setup()')+btn('إعادة جميع الكلمات','restartWords()','secondary'));return}
pickedCategory=selected.category;word=selected.word;const help=makeSpyHint(selected.group);roundHint=help.clue;spyQuestions=help.examples;
const pool=selected.group.words.filter(w=>w!==word);for(let i=pool.length-1;i>0;i--){let j=rand(i+1);[pool[i],pool[j]]=[pool[j],pool[i]]}
guessOptions=[word,...pool.slice(0,5)];for(let i=guessOptions.length-1;i>0;i--){let j=rand(i+1);[guessOptions[i],guessOptions[j]]=[guessOptions[j],guessOptions[i]]}
spy=nextSpy();turn=0;seen=false;votes=[];voter=0;round++;askQueue=[];lastAsker=-1;lastPair='';askTurn=0;pass()}
function pass(){panel('<span class="pill">الجولة '+round+' • '+(turn+1)+' من '+playerCount+'</span><h2>سلّم التلفون إلى<br>'+esc(names[turn])+'</h2><p>لا تخلي غيرك يشوف البطاقة</p>'+btn('اكشف بطاقتي','reveal()'))}function reveal(){seen=true;
const spyCard='<div class="secret">إنت الدخيل!</div><p>ما تعرف الكلمة. هاي المعلومة إلك وحدك:</p><div class="hint">'+esc(roundHint)+'</div><p>أسئلة ممكن تفيدك:</p><div class="stack">'+spyQuestions.map(q=>'<div class="pill">'+esc(q)+'</div>').join('')+'</div><p>اسمع سوالفهم وخلي إجاباتك طبيعية.</p>';
const normalCard='<p>الكلمة السرية هي</p><div class="secret">'+esc(word)+'</div><p>اسأل وجاوب بدون ما تفضح الكلمة. الدخيل ما يعرفها!</p>';
panel('<span class="pill">'+esc(names[turn])+'</span>'+(turn===spy?spyCard:normalCard)+btn('خفي البطاقة ومرر التلفون','next()'))}
function next(){turn++;if(turn<playerCount)pass();else discussion()}function discussion(){seconds=180;nextQuestion();talk();timer=setInterval(()=>{if(seconds>0){seconds--;let t=document.getElementById('clock');if(t)t.textContent=fmt(seconds)}else clearInterval(timer)},1000)}function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}function talk(){panel('<span class="pill">وقت السوالف • السؤال '+askTurn+'</span><h2>منو يسأل من؟</h2><div class="ask-pair"><strong>'+esc(names[asker])+'</strong><span>يسأل</span><strong>'+esc(names[asked])+'</strong></div><p>اسأله عن الكلمة بدون ما تذكرها، وخلي الجواب ذكي!</p><div class="secret" id="clock">'+fmt(seconds)+'</div>'+btn('مرر السؤال لشخص ثاني','nextTalk()')+btn('يلا نخمن الكلمة','guessPass()','secondary')+btn('جولة جديدة','setup()','secondary'))}function nextTalk(){nextQuestion();talk()}
function vote(){clearInterval(timer);voter=0;votes=[];votePass()}function votePass(){panel('<span class="pill">التصويت • '+(voter+1)+' من ٤</span><h2>دور '+esc(names[voter])+'</h2><p>سلّم التلفون إله حتى يصوّت بالسر</p>'+btn('أصوّت هسه','votePick()'))}function votePick(){panel('<h2>منو الدخيل برأيك؟</h2><p>اختار لاعب غير نفسك</p><div class="choices">'+names.map((n,i)=>i===voter?'':btn(esc(n),'cast('+i+')','secondary')).join('')+'</div>')}function cast(i){votes.push(i);voter++;if(voter<playerCount)votePass();else result()}function result(){let counts=Array(playerCount).fill(0);votes.forEach(i=>counts[i]++);let max=Math.max(...counts),winners=counts.map((n,i)=>n===max?i:-1).filter(i=>i>=0);found=winners.length===1&&winners[0]===spy;panel('<span class="pill">نتيجة التصويت</span><h2>'+(found?'مسكتوا الدخيل!':'ما اتفقتوا على الدخيل!')+'</h2><p>الدخيل هو <strong>'+esc(names[spy])+'</strong></p><p>الأصوات: '+names.map((n,i)=>esc(n)+' '+counts[i]).join(' • ')+'</p><p>بس بعد عنده فرصة يخمّن الكلمة ويفوز!</p>'+btn('سلّم التلفون للدخيل','guessPass()'))}
function guessPass(){clearInterval(timer);panel('<h2>دور '+esc(names[spy])+'</h2><p>الدخيل عنده محاولة وحدة يختار من ٦ كلمات. لا أحد يساعده!</p>'+btn('شوف الخيارات','guessScreen()'))}
function guessScreen(){panel('<span class="pill">تحدي الدخيل</span><h2>شنو الكلمة السرية؟</h2><p>اختار وحدة من هاي الكلمات الستة</p><div class="choices">'+guessOptions.map((w,i)=>btn(esc(w),'finish('+i+')','secondary')).join('')+'</div>')}
function finish(i){const correct=guessOptions[i]===word;if(correct){scores[names[spy]]=(scores[names[spy]]||0)+3}else{names.forEach((n,j)=>{if(j!==spy)scores[n]=(scores[n]||0)+2})}saveScores();panel('<span class="pill">نهاية الجولة '+round+'</span><h2>'+(correct?'الدخيل خمّنها صح!':'الفريق فاز!')+'</h2><p>الكلمة كانت</p><div class="secret">'+esc(word)+'</div><p>'+(correct?'الدخيل +٣ نقاط':'كل لاعب مو دخيل +٢ نقاط')+'</p>'+scoreboard()+btn('جولة جديدة','setup()')+btn('تصفير النقاط','resetScores()','secondary'))}
function resetScores(){if(!confirm('متأكد تريد تصفّر كل النقاط؟'))return;scores={};saveScores();setup()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}setup();
</script></html>
